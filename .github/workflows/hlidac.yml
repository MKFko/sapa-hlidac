name: Sapa Trip hlídač

on:
  schedule:
    - cron: "*/5 * * * *"    # každých 5 minut (GitHub může mít pár minut zpoždění)
  workflow_dispatch:          # ruční spuštění z webu (záložka Actions)
    inputs:
      test:
        description: "Poslat zkušební upozornění"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: hlidac

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kontrola termínů
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python sapa_hlidac.py ${{ inputs.test && '--test' || '' }}
      - name: Uložení stavu (co už bylo ohlášeno)
        if: always()
        run: |
          git config user.name "sapa-hlidac"
          git config user.email "sapa-hlidac@users.noreply.github.com"
          git add state.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Aktualizace stavu" && git pull --rebase && git push)
